name: Fix website auth session

on:
  push:
    paths:
      - ".github/workflows/fix-website-auth-session.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Align the website profile with mandatory account access
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("app/WebsiteNavbarProfile.tsx")
          text = path.read_text()

          old = '''  const logOut = () => {
    window.localStorage.removeItem(PROFILE_STORAGE_KEY);
    setProfile({ displayName: "Burma AI Studio Client", email: "", company: "" });
    setOpen(false);
    setView("menu");
    showToast(t.sessionCleared);
    router.push("/");
  };'''
          new = '''  const logOut = async () => {
    try {
      await fetch("/api/account/sign-out", { method: "POST", cache: "no-store" });
    } catch {
      // Continue with local cleanup; the Intro gate verifies the session on reload.
    }
    window.localStorage.removeItem(PROFILE_STORAGE_KEY);
    document.documentElement.classList.remove("bas-intro-skip");
    setProfile({ displayName: "Burma AI Studio Client", email: "", company: "" });
    setOpen(false);
    setView("menu");
    showToast(t.sessionCleared);
    window.location.assign("/");
  };'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'const logOut = async () =>' not in text:
              raise SystemExit("Expected website logout block was not found")

          replacements = {
              'guest: "Guest access · Website"': 'guest: "Website account"',
              'guestAccess: "Guest website access"': 'guestAccess: "Website account access"',
              'guest: "Guest access · Website"': 'guest: "Website account"',
          }
          for before, after in replacements.items():
              text = text.replace(before, after)

          path.write_text(text)
          PY

          rm -f .github/workflows/fix-website-auth-session.yml

      - name: Commit account-session fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/WebsiteNavbarProfile.tsx .github/workflows/fix-website-auth-session.yml
          git commit -m "Finish mandatory website account session flow"
          git push origin HEAD:main
