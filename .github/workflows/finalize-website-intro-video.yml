name: Finalize website intro video

on:
  push:
    paths:
      - ".github/workflows/finalize-website-intro-video.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Point website intro at the local MP4
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("app/WebsiteIntroGate.tsx")
          text = path.read_text()
          old = 'src="/api/website-intro-video"'
          new = 'src="/burma-ai-studio-intro.mp4"'
          if old not in text:
              raise SystemExit("Expected intro video source was not found")
          text = text.replace(old, new, 1)

          old_attrs = '''          disablePictureInPicture\n          tabIndex={-1}'''
          new_attrs = '''          disablePictureInPicture\n          disableRemotePlayback\n          controlsList="nodownload nofullscreen noremoteplayback"\n          tabIndex={-1}'''
          if old_attrs in text:
              text = text.replace(old_attrs, new_attrs, 1)

          path.write_text(text)
          PY

          rm -f app/api/website-intro-video/route.ts
          rm -f .github/workflows/import-website-intro-video.yml
          rm -f .github/workflows/finalize-website-intro-video.yml

      - name: Commit final website-only intro fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use local MP4 for website intro without player controls"
          git push origin HEAD:main
