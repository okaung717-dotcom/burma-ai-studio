name: Fix Myanmar intro headline

on:
  push:
    paths:
      - ".github/workflows/fix-intro-mm-headline.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Refine only the website Intro Myanmar headline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          component = Path("app/WebsiteIntroGate.tsx")
          text = component.read_text()
          old = '''    title1: "စိတ်ကူးတိုင်းကို အသက်ဝင်စေမယ့်",
    title2: "Cinematic AI Storytelling.",'''
          new = '''    title1: "Brand ကို ပိုထင်ရှားစေမယ့်",
    title2: "AI Marketing Visuals.",'''
          if old not in text:
              raise SystemExit("Expected Myanmar intro headline was not found")
          component.write_text(text.replace(old, new, 1))

          css = Path("app/website-intro-gate.css")
          css_text = css.read_text()
          marker = "/* MM intro headline fit fix — keeps the marketing hero fully inside the desktop viewport. */"
          block = r'''

/* MM intro headline fit fix — keeps the marketing hero fully inside the desktop viewport. */
.bas-intro.is-mm .bas-intro-content {
  width: min(820px, 58vw);
}

.bas-intro.is-mm .bas-intro-content h1 {
  max-width: 820px;
  margin: 18px 0 18px;
  font-size: clamp(42px, 4.6vw, 72px);
  line-height: 1.18;
}

.bas-intro.is-mm .bas-intro-content h1 span,
.bas-intro.is-mm .bas-intro-content h1 em {
  display: block;
}

.bas-intro.is-mm .bas-intro-content h1 span {
  line-height: 1.34;
}

.bas-intro.is-mm .bas-intro-content h1 em {
  margin-top: 4px;
  font-family: "Sora", "Noto Sans Myanmar", sans-serif;
  letter-spacing: -.05em;
  line-height: 1.04;
  white-space: nowrap;
}

@media (max-width: 860px) {
  .bas-intro.is-mm .bas-intro-content {
    width: auto;
  }

  .bas-intro.is-mm .bas-intro-content h1 {
    max-width: 720px;
    font-size: clamp(36px, 7.3vw, 54px);
  }

  .bas-intro.is-mm .bas-intro-content h1 em {
    white-space: normal;
  }
}
'''
          if marker in css_text:
              css_text = css_text.split(marker, 1)[0].rstrip() + block
          else:
              css_text = css_text.rstrip() + block
          css.write_text(css_text)
          PY

          rm -f .github/workflows/fix-intro-mm-headline.yml

      - name: Commit website-only Intro refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/WebsiteIntroGate.tsx app/website-intro-gate.css .github/workflows/fix-intro-mm-headline.yml
          git commit -m "Fit Myanmar intro headline and sharpen marketing copy"
          git push origin HEAD:main
