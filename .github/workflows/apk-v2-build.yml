name: Build Burma AI Studio APK v2

on:
  push:
    branches:
      - apk-v2-masterpiece
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    if: github.ref_name == 'apk-v2-masterpiece' || github.head_ref == 'apk-v2-masterpiece'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout APK branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Next.js APK interface
        run: npm run build

      - name: Verify isolated APK web deployment
        run: |
          APP_URL="https://burma-ai-studio-git-apk-v2-masterpiece-okkar-s-projects.vercel.app/?source=native&apk=v2"
          for attempt in $(seq 1 18); do
            echo "Deployment check ${attempt}/18"
            if curl --fail --location --silent --show-error --max-time 30 "$APP_URL" > /tmp/apk-v2.html; then
              test -s /tmp/apk-v2.html
              echo "Isolated APK deployment is reachable."
              exit 0
            fi
            sleep 10
          done
          echo "APK deployment could not be reached."
          exit 1

      - name: Synchronize Capacitor Android project
        run: npx cap sync android

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK artifact
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/Burma-AI-Studio-v2.0.0.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Burma-AI-Studio-v2.0.0-APK
          path: dist-apk/Burma-AI-Studio-v2.0.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable APK download release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="apk-v2.0.0"
          APK_PATH="dist-apk/Burma-AI-Studio-v2.0.0.apk"
          RELEASE_TITLE="Burma AI Studio APK v2.0.0"
          RELEASE_NOTES="Burma AI Studio Android APK v2.0.0. Built from the isolated apk-v2-masterpiece branch. The production desktop, phone and tablet website is not included in this release."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES"
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES"
          fi
