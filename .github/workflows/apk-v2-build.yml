name: Build Burma AI Studio APK v2

on:
  push:
    branches:
      - apk-v2-masterpiece
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    if: github.ref_name == 'apk-v2-masterpiece' || github.head_ref == 'apk-v2-masterpiece'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout APK branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate website source without publishing it
        run: npm run build

      - name: Validate bundled APK interface
        run: |
          test -s apk-web/index.html
          test -s apk-web/app.css
          test -s apk-web/app.js
          grep -q "Burma AI Studio" apk-web/index.html
          grep -q "bas_apk_v201_intro" apk-web/app.js

      - name: Synchronize bundled Capacitor Android project
        run: npx cap sync android

      - name: Verify Vercel is not configured as APK server
        run: |
          if grep -q "vercel.app" capacitor.config.ts; then
            echo "APK must not depend on a protected Vercel preview."
            exit 1
          fi
          grep -q 'webDir: "apk-web"' capacitor.config.ts

      - name: Build installable debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK artifact
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-apk/Burma-AI-Studio-v2.0.1.apk

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Burma-AI-Studio-v2.0.1-APK
          path: dist-apk/Burma-AI-Studio-v2.0.1.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable APK download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="apk-v2.0.1"
          APK_PATH="dist-apk/Burma-AI-Studio-v2.0.1.apk"
          RELEASE_TITLE="Burma AI Studio APK v2.0.1"
          RELEASE_NOTES="Self-contained Burma AI Studio Android APK v2.0.1. The application interface is bundled inside the APK and no longer opens a protected Vercel preview. Desktop, phone and tablet website production remains untouched."

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK_PATH" --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES"
          else
            gh release create "$RELEASE_TAG" "$APK_PATH" --title "$RELEASE_TITLE" --notes "$RELEASE_NOTES"
          fi
