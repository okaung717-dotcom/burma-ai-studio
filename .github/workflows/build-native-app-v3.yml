name: Build Native APK v3.1.0

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "native-app/**"
      - "android/**"
      - "capacitor.config.ts"
      - ".github/workflows/build-native-app-v3.yml"
  push:
    branches: [native-app-v3-1-stories-chat, main]
    paths:
      - "native-app/**"
      - "android/**"
      - "capacitor.config.ts"
      - ".github/workflows/build-native-app-v3.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify bundled native app entry
        run: |
          test -s native-app/index.html
          grep -q "Burma AI Studio v3.1.0" native-app/index.html
          grep -q 'data-nav="stories"' native-app/index.html
          grep -q 'data-nav="chat"' native-app/index.html
          if grep -q 'data-nav="ai"' native-app/index.html; then
            echo "The retired center AI navigation item is still present"
            exit 1
          fi
          if grep -q "server:" capacitor.config.ts; then
            echo "Remote Capacitor server dependency is not allowed for this APK"
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('native-app/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map((match) => match[1]);
          if (!scripts.length) throw new Error('No inline app script found');
          fs.writeFileSync('/tmp/native-app-inline.js', scripts.join('\n'));
          NODE
          node --check /tmp/native-app-inline.js

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Burma-AI-Studio-v3.1.0.apk
          sha256sum dist/Burma-AI-Studio-v3.1.0.apk > dist/Burma-AI-Studio-v3.1.0.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Burma-AI-Studio-v3.1.0
          path: dist/*
          if-no-files-found: error
          retention-days: 30
