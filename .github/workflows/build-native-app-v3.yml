name: Build Native APK v3

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "app/AppExperience.tsx"
      - "app/AppBottomNav.tsx"
      - "android/**"
      - "capacitor.config.ts"
      - ".github/workflows/build-native-app-v3.yml"
  push:
    branches: [app-v3-native-redesign, main]
    paths:
      - "app/AppExperience.tsx"
      - "app/AppBottomNav.tsx"
      - "android/**"
      - "capacitor.config.ts"
      - ".github/workflows/build-native-app-v3.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate production application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Burma-AI-Studio-v3.0.0.apk
          sha256sum dist/Burma-AI-Studio-v3.0.0.apk > dist/Burma-AI-Studio-v3.0.0.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Burma-AI-Studio-v3.0.0
          path: dist/*
          if-no-files-found: error
          retention-days: 30
