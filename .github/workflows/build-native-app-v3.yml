name: Build Native APK v3.1.4

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "native-app/**"
      - "scripts/build-native-app-v3.1.2.mjs"
      - "scripts/finalize-native-app-v3.1.2.mjs"
      - "scripts/fit-native-keyboard-v3.1.3.mjs"
      - "scripts/patch-native-settings-v3.1.4.mjs"
      - "scripts/repair-settings-patcher-v3.1.4.mjs"
      - "scripts/smoke-native-app-v3.1.4.mjs"
      - "android/**"
      - "capacitor.config.ts"
      - ".github/workflows/build-native-app-v3.yml"
  push:
    branches: [native-app-v3-1-4-settings, main]
    paths:
      - "native-app/**"
      - "scripts/build-native-app-v3.1.2.mjs"
      - "scripts/finalize-native-app-v3.1.2.mjs"
      - "scripts/fit-native-keyboard-v3.1.3.mjs"
      - "scripts/patch-native-settings-v3.1.4.mjs"
      - "scripts/repair-settings-patcher-v3.1.4.mjs"
      - "scripts/smoke-native-app-v3.1.4.mjs"
      - "android/**"
      - "capacitor.config.ts"
      - ".github/workflows/build-native-app-v3.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Build resilient bundled native app
        run: node scripts/build-native-app-v3.1.2.mjs

      - name: Finalize unique native controls
        run: node scripts/finalize-native-app-v3.1.2.mjs

      - name: Fit Chat to Android keyboard
        run: node scripts/fit-native-keyboard-v3.1.3.mjs

      - name: Repair settings patch anchors
        run: node scripts/repair-settings-patcher-v3.1.4.mjs

      - name: Add app icon header and complete settings
        run: node scripts/patch-native-settings-v3.1.4.mjs

      - name: Verify bundled native app entry
        run: |
          test -s native-app/index.html
          grep -q "Burma AI Studio v3.1.4" native-app/index.html
          grep -q 'class="logo appIcon"' native-app/index.html
          grep -q 'data:image/png;base64,' native-app/index.html
          grep -q 'id="notifications"' native-app/index.html
          grep -q 'id="notificationDrawer"' native-app/index.html
          grep -q 'id="settings"' native-app/index.html
          grep -q 'data-settings-view="profile"' native-app/index.html
          grep -q 'data-settings-view="projects"' native-app/index.html
          grep -q 'data-settings-view="personalization"' native-app/index.html
          grep -q 'data-settings-view="support"' native-app/index.html
          grep -q 'data-settings-view="privacy"' native-app/index.html
          grep -q 'id="logout"' native-app/index.html
          grep -q 'class="composeField"' native-app/index.html
          grep -q 'id="sendMessage"' native-app/index.html
          grep -q "window.__basSyncKeyboardLayout" native-app/index.html
          grep -q "window.__basHideSplash" native-app/index.html
          grep -q "android:windowSoftInputMode=\"adjustResize\"" android/app/src/main/AndroidManifest.xml
          grep -q 'versionName "3.1.4"' android/app/build.gradle
          if grep -q 'class="chatintro"' native-app/index.html; then
            echo "The retired standalone Chat intro remains"
            exit 1
          fi
          if grep -q 'class="direct"' native-app/index.html; then
            echo "The retired external Chat contact grid remains"
            exit 1
          fi
          if grep -q "server:" capacitor.config.ts; then
            echo "Remote Capacitor server dependency is not allowed for this APK"
            exit 1
          fi
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('native-app/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/g)].map((match) => match[1]);
          if (scripts.length < 3) throw new Error('Required native scripts are missing');
          const ids = [...html.matchAll(/\sid="([^"]+)"/g)].map((match) => match[1]);
          const duplicateIds = [...new Set(ids.filter((id, index) => ids.indexOf(id) !== index))];
          if (duplicateIds.length) throw new Error(`Duplicate native IDs: ${duplicateIds.join(', ')}`);
          fs.writeFileSync('/tmp/native-app-inline.js', scripts.join('\n'));
          NODE
          node --check /tmp/native-app-inline.js

      - name: Install native runtime smoke-test dependency
        run: npm install --no-save --package-lock=false --no-audit --no-fund jsdom

      - name: Run native startup, settings and keyboard smoke test
        run: node scripts/smoke-native-app-v3.1.4.mjs

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Burma-AI-Studio-v3.1.4.apk
          sha256sum dist/Burma-AI-Studio-v3.1.4.apk > dist/Burma-AI-Studio-v3.1.4.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Burma-AI-Studio-v3.1.4
          path: dist/*
          if-no-files-found: error
          retention-days: 30
