name: Build Native APK v3.0.1

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "native-app/**"
      - "android/**"
      - "capacitor.config.ts"
      - ".github/workflows/build-native-app-v3.yml"
  push:
    branches: [fix-apk-offline-shell-v3-0-1, main]
    paths:
      - "native-app/**"
      - "android/**"
      - "capacitor.config.ts"
      - ".github/workflows/build-native-app-v3.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify bundled native app entry
        run: |
          test -s native-app/index.html
          grep -q "Burma AI Studio v3.0.1" native-app/index.html
          if grep -q "server:" capacitor.config.ts; then
            echo "Remote Capacitor server dependency is not allowed for this APK"
            exit 1
          fi

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/Burma-AI-Studio-v3.0.1.apk
          sha256sum dist/Burma-AI-Studio-v3.0.1.apk > dist/Burma-AI-Studio-v3.0.1.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Burma-AI-Studio-v3.0.1
          path: dist/*
          if-no-files-found: error
          retention-days: 30
