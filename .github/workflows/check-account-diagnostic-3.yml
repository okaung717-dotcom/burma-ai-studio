name: Check account diagnostic 3

on:
  push:
    paths:
      - ".github/workflows/check-account-diagnostic-3.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Capture live diagnostic
        shell: bash
        run: |
          set +e
          body=$(mktemp)
          status=$(curl -sS --max-time 25 -o "$body" -w '%{http_code}' https://burmaaistudio.com/api/account/diag20260727)
          rc=$?
          printf '{"curl_exit":%s,"http_status":"%s","body":' "$rc" "$status" > ACCOUNT_DIAG_RESULT_3.json
          python - "$body" >> ACCOUNT_DIAG_RESULT_3.json <<'PY'
          import json, sys
          text=open(sys.argv[1], 'r', errors='replace').read()
          print(json.dumps(text), end='')
          PY
          printf '}\n' >> ACCOUNT_DIAG_RESULT_3.json
          exit 0
      - name: Commit and self-remove
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/check-account-diagnostic-3.yml
          git add ACCOUNT_DIAG_RESULT_3.json .github/workflows/check-account-diagnostic-3.yml
          git commit -m "Capture live account diagnostic"
          git push origin HEAD:main
